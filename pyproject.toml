[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "Electrical_Docs"
dynamic = ["version"]
description = "Electrical theory, signal processing, load forecasting and energy cost"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "Apache-2.0"}
authors = [{name = "Benedict Thekkel", email = "bthekkel1@gmail.com"}]
keywords = ['nbdev', 'jupyter', 'notebook', 'python']
classifiers = ["Natural Language :: English", "Intended Audience :: Developers", "Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
dependencies = []

[project.urls]
Repository = "https://github.com/bthek1/Electrical_Docs"
Documentation = "https://bthek1.github.io/Electrical_Docs"

[project.entry-points.nbdev]
Electrical_Docs = "Electrical_Docs._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "Electrical_Docs.__version__"}

[tool.setuptools.packages.find]
include = ["Electrical_Docs"]

[tool.nbdev]
